<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f4f1ea"/>
  <rect x="40" y="32" width="1360" height="72" rx="18" fill="#173f35"/>
  <text x="72" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#f8f6f0">Dashboard de retencion, cohortes y RFM</text>
  <text x="72" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cfe0d9">Mockup funcional para implementacion en Power BI</text>

  <rect x="40" y="130" width="300" height="120" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <rect x="360" y="130" width="300" height="120" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <rect x="680" y="130" width="300" height="120" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <rect x="1000" y="130" width="400" height="120" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>

  <text x="64" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b5a56">Clientes totales</text>
  <text x="64" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="#173f35">5,878</text>

  <text x="384" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b5a56">Repeat rate</text>
  <text x="384" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="#173f35">72.39%</text>

  <text x="704" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b5a56">Revenue total</text>
  <text x="704" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#173f35">GBP 17.69M</text>

  <text x="1024" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b5a56">Ticket promedio por orden</text>
  <text x="1024" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="38" fill="#173f35">GBP 478.39</text>

  <rect x="40" y="280" width="680" height="290" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <text x="64" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173f35">Retencion por cohorte</text>
  <g fill="#d9efe5">
    <rect x="72" y="345" width="80" height="35"/>
    <rect x="154" y="345" width="80" height="35" fill="#b9dfcf"/>
    <rect x="236" y="345" width="80" height="35" fill="#8dc8b1"/>
    <rect x="318" y="345" width="80" height="35" fill="#5ca889"/>
    <rect x="400" y="345" width="80" height="35" fill="#2f7e62"/>
    <rect x="482" y="345" width="80" height="35" fill="#215d49"/>
    <rect x="564" y="345" width="80" height="35" fill="#173f35"/>

    <rect x="72" y="382" width="80" height="35" fill="#cce8dc"/>
    <rect x="154" y="382" width="80" height="35" fill="#9ed2bc"/>
    <rect x="236" y="382" width="80" height="35" fill="#6ab393"/>
    <rect x="318" y="382" width="80" height="35" fill="#447f68"/>
    <rect x="400" y="382" width="80" height="35" fill="#f2ede4"/>
    <rect x="482" y="382" width="80" height="35" fill="#f2ede4"/>
    <rect x="564" y="382" width="80" height="35" fill="#f2ede4"/>

    <rect x="72" y="419" width="80" height="35" fill="#cce8dc"/>
    <rect x="154" y="419" width="80" height="35" fill="#aad8c4"/>
    <rect x="236" y="419" width="80" height="35" fill="#7cbc9f"/>
    <rect x="318" y="419" width="80" height="35" fill="#4c8e73"/>
    <rect x="400" y="419" width="80" height="35" fill="#2f7e62"/>
    <rect x="482" y="419" width="80" height="35" fill="#f2ede4"/>
    <rect x="564" y="419" width="80" height="35" fill="#f2ede4"/>
  </g>

  <rect x="760" y="280" width="640" height="290" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <text x="784" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173f35">Distribucion de segmentos RFM</text>
  <rect x="792" y="360" width="420" height="30" rx="8" fill="#c9b27c"/>
  <rect x="792" y="406" width="225" height="30" rx="8" fill="#173f35"/>
  <rect x="792" y="452" width="180" height="30" rx="8" fill="#8d4f2a"/>
  <rect x="792" y="498" width="140" height="30" rx="8" fill="#a4b464"/>
  <rect x="792" y="544" width="124" height="30" rx="8" fill="#5ca889"/>
  <text x="1228" y="381" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5b5a56">hibernating</text>
  <text x="1033" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5b5a56">champions</text>
  <text x="988" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5b5a56">at_risk</text>
  <text x="948" y="519" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5b5a56">potential_loyalists</text>
  <text x="930" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5b5a56">loyal_customers</text>

  <rect x="40" y="600" width="1360" height="240" rx="18" fill="#fffdf8" stroke="#d7d0c2"/>
  <text x="64" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#173f35">Lectura ejecutiva</text>
  <text x="64" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b5a56">• La retencion temprana ronda 23% en M1 y cae con rapidez entre cohortes.</text>
  <text x="64" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b5a56">• El segmento champions concentra gran parte del valor historico.</text>
  <text x="64" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b5a56">• Hibernating es el grupo mas grande y sugiere una oportunidad de reactivacion.</text>
  <text x="64" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5b5a56">• Unido con cohortes, RFM separa recurrencia de contribucion economica.</text>
</svg>
